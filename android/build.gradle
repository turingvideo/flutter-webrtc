group 'com.cloudwebrtc.webrtc'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

// AGP 9's built-in Kotlin compiles Kotlin itself and rejects the Kotlin Gradle
// Plugin. Apply KGP only when built-in Kotlin is NOT active: that means AGP < 9,
// or AGP 9 with android.builtInKotlin=false (the configuration Flutter currently
// ships by default while the ecosystem migrates).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.cloudwebrtc.webrtc'
    }
    compileSdkVersion 36
    // Flutter's Gradle plugin defaults every plugin subproject's
    // android.ndkVersion independently of the app module's own override
    // (app/build.gradle can set a different one for itself without this
    // module inheriting it) -- externalNativeBuild below only started
    // actually invoking NDK resolution once this module needed CMake, so
    // pin explicitly to a version known to be installed rather than
    // relying on whatever ndk.dir happens to point at.
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
        // Only the ABIs the vendor MediaSDK ships prebuilt .so's for (see
        // fisheye/android/vendor/libs) -- without this filter Gradle would
        // also try to package x86/x86_64 variants that don't exist and fail.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // JNI bridge to the vendor MediaSDK C API (fisheye/android/vendor) --
    // see fisheye/android/src/main/cpp/mediasdk_jni.cpp and
    // MediaSdkFisheyePlayer.java.
    externalNativeBuild {
        cmake {
            path '../fisheye/android/src/main/cpp/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Fisheye dewarp source lives under ../fisheye instead of src/main/java so
    // it stays together with its darwin (common/darwin -> fisheye/darwin) and
    // vendor-SDK counterparts instead of being scattered across per-platform
    // source trees. Package declarations are unchanged (still
    // com.cloudwebrtc.webrtc), so this is just an extra source root, not a
    // package rename.
    sourceSets {
        main {
            java.srcDirs += '../fisheye/android/src/main/java'
            // Vendor MediaSDK prebuilt .so's (libMediaSDK.so + its own
            // runtime dependencies) packaged straight into the APK per ABI.
            jniLibs.srcDirs += '../fisheye/android/vendor/libs'
        }
    }
}

// Configure the Kotlin JVM target. The compilerOptions DSL requires KGP 1.9+ or
// AGP 9 built-in Kotlin; older Flutter app templates ship KGP 1.8.x, which only
// supports the legacy kotlinOptions DSL.
def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'com.github.davidliu:audioswitch:039a35aefab7747c557242fa216c9ea11743b604'
    implementation 'androidx.annotation:annotation:1.1.0'
    testImplementation 'junit:junit:4.13.2'
}
